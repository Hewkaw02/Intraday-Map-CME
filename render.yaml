services:
  - type: web
    name: intraday-map-cme-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHONPATH
        value: .
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: CME_DATA_DIR
        value: frontend/public/data

  - type: static
    name: intraday-map-cme
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    branch: main
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE
        value: https://intraday-map-cme-api.onrender.com/api
      - key: VITE_WS_BASE
        value: wss://intraday-map-cme-api.onrender.com/ws/market
